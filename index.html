<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PSU-Card Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root, html, body {
      margin: 0;
      padding: 0;
      font-family: var(--ddd-font-primary);
      min-height: 100vh;
      background-color: grey;  /* ← use correct grey token */
    }
    #demo {
      background-color: grey;  /* ← use correct grey token */
      margin: var(--ddd-spacing-4);
      display: flex;
      flex-wrap: wrap;
      gap: var(--ddd-spacing-4);
    }
  </style>
</head>
<body>
  <div id="demo">
    <psu-card 
      title="Abington" 
      label="Close to Philadelphia, Penn State Abington’s suburban campus offers bachelor's degrees, athletics, and a diverse student community." 
      image="https://images.ctfassets.net/ni9rh5nu0d99/1paFaX2Dc7iHh9Z6K7mIim/1427b9970ff21dd9c8a770067638efc1/abington-02.jpg?fm=webp&w=1920&q=75">
    </psu-card>
    <psu-card 
      title="Altoona" 
      label="In central Pennsylvania close to University Park, Penn State Altoona offers the appeal of a small college with the prestige of a major research university." 
      image="https://images.ctfassets.net/ni9rh5nu0d99/6oBUNrVTNPJaoE9ahnVX2E/2c655bdcf28befdf81d5a24248a9dca5/altoona-01.jpg?fm=webp&w=1920&q=75">

    </psu-card>
    <psu-card 
      title="Beaver" 
      label="Situated on one hundred acres, Penn State Beaver offers several bachelor's degrees, on-campus housing, and varsity sports, all within easy reach of Pittsburgh." 
      image="https://images.ctfassets.net/ni9rh5nu0d99/C6YPZMqHyRaPeRrVTun8k/1ca61866afa1b3d903944a38ea34cecc/beaver-01.jpg?fm=webp&w=1920&q=75">
    </psu-card>
    <psu-card 
      title="Behrend" 
      label="Located in northwestern Pennsylvania, Penn State Behrend offers undergraduate and graduate degrees, research experiences, on-campus living, and athletics." 
      image="https://images.ctfassets.net/ni9rh5nu0d99/1at2Tdx2RaIuI56SVrUWFM/b06b752a3e78509f0266db2b59aa5364/behrend-01.jpg?fm=webp&w=1920&q=75">
    </psu-card>
    <psu-card 
      title="Berks" 
      label="Penn State Berks offers bachelor’s degrees and four associate programs with small classes, internships, undergraduate research opportunities, and residential campus life." 
      image="https://images.ctfassets.net/ni9rh5nu0d99/3WXgadpl3oKX50MmPHGV6m/a91103dc9e4bbe123e29fd25b81e3402/berks-02.jpg?fm=webp&w=1920&q=75">
    </psu-card>
  </div>
  
  <!-- Load the psu-card module -->
  <script type="module" src="./psu-card.js"></script>
</body>
</html>
